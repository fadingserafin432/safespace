<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fairydale | Veronica Lancet</title>
    <meta name="viewport" content="width=1100">
    <style>
        :root {
            /* WHIMSICAL COLOR PALETTE */
            --petal-pink: #fce4ec;
            --enchanted-sage: #8da399;
            --stardust-white: #ffffff;
            --pixie-purple: #9c89b8;
            --morning-mist: #f3f7f0;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --bg-overlay: rgba(243, 247, 240, 0.85); /* Soft morning light filter */
        }

        body {
            margin: 0; padding: 0;
            /* Using a more storybook-esque font stack */
            font-family: 'Georgia', serif;
            color: #4a4a4a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--morning-mist) url('img/fairydale.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-overlay);
            backdrop-filter: blur(10px);
            z-index: -1;
        }

        /* Nav Button */
        .back-nav {
            position: fixed; top: 30px; left: 30px;
            color: var(--enchanted-sage); text-decoration: none;
            background: white;
            padding: 10px 25px; border-radius: 50px;
            font-size: 14px; z-index: 100;
            border: 2px solid var(--petal-pink);
            transition: 0.3s;
            text-transform: lowercase;
            font-style: italic;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .back-nav:hover { background: var(--petal-pink); color: white; transform: translateY(-2px); }

        .container {
            width: 850px;
            margin-top: 80px;
            padding-bottom: 80px;
            z-index: 1;
        }

        /* Header Section */
        .header-section {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 50px;
        }

        .book-cover {
            width: 240px;
            border-radius: 20px; /* Softer corners */
            box-shadow: 0 20px 40px rgba(156, 137, 184, 0.2);
            flex-shrink: 0;
            border: 6px solid white;
        }

        .book-meta {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 { 
            font-size: 3.5em; 
            margin: 0; 
            color: var(--pixie-purple); 
            text-shadow: 1px 1px 0px white;
            letter-spacing: 1px;
            font-weight: normal;
        }

        .author { 
            font-size: 1.4em; 
            color: var(--enchanted-sage); 
            margin: 5px 0 20px 0; 
            font-style: italic; 
        }

        /* Star Rating Styles */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            margin-bottom: 5px;
        }
        .star-rating input { display: none; }
        .star-rating label {
            font-size: 32px;
            color: #ddd;
            cursor: pointer;
            transition: 0.2s;
            padding: 0 2px;
        }
        .star-rating label:hover,
        .star-rating label:hover ~ label,
        .star-rating input:checked ~ label {
            color: #ffcc33; /* Bright golden yellow */
            text-shadow: 0 0 8px rgba(255, 204, 51, 0.5);
        }

        #rating-label {
            font-size: 0.9em;
            color: var(--enchanted-sage);
            margin: 0;
        }

        /* Content Sections */
        section {
            background: var(--glass-bg);
            backdrop-filter: blur(5px);
            padding: 40px;
            border-radius: 30px; /* Highly rounded for whimsy */
            margin-bottom: 25px;
            border: 2px solid white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }

        h2 { 
            font-size: 1.2em; 
            text-transform: lowercase; 
            letter-spacing: 2px; 
            margin-top: 0; 
            color: var(--pixie-purple); 
            border-bottom: 1px dashed var(--petal-pink);
            display: inline-block;
            margin-bottom: 20px;
        }

        .description-text { line-height: 1.8; font-size: 1.1em; color: #555; }

        /* Download Button */
        .download-container { text-align: center; }
        .download-btn {
            display: inline-block;
            background: var(--pixie-purple);
            color: white;
            padding: 16px 45px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 15px;
            letter-spacing: 1px;
            transition: 0.4s;
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(156, 137, 184, 0.3);
        }
        .download-btn:hover { 
            transform: scale(1.05) rotate(-1deg); 
            background: var(--enchanted-sage);
        }

        /* Comments */
        textarea {
            width: 100%;
            height: 110px;
            background: white;
            border: 2px solid var(--petal-pink);
            border-radius: 15px;
            padding: 15px;
            color: #444;
            font-family: inherit;
            resize: none;
            box-sizing: border-box;
        }
        .post-btn {
            margin-top: 15px;
            background: var(--petal-pink);
            color: #4a4a4a;
            border: none;
            padding: 12px 35px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .post-btn:hover { background: var(--pixie-purple); color: white; }

        .comment-box { 
            background: rgba(255,255,255,0.8); 
            padding: 20px; 
            border-radius: 20px; 
            margin-bottom: 15px; 
            border-left: 5px solid var(--petal-pink);
        }
        .comment-time { color: var(--enchanted-sage); font-size: 0.85em; }

        footer { text-align: center; padding: 50px; font-size: 0.9em; color: var(--enchanted-sage); letter-spacing: 2px; }
    </style>
</head>
